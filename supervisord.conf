[supervisord]
nodaemon=true
user=user
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:auth-service]
command=uvicorn main:app --host 0.0.0.0 --port 8000
directory=/app/auth-service
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=AUTH_DB_DIR="%(ENV_AUTH_DB_DIR)s",MAIL_USERNAME="%(ENV_MAIL_USERNAME)s",MAIL_PASSWORD="%(ENV_MAIL_PASSWORD)s",MAIL_FROM="%(ENV_MAIL_FROM)s",MAIL_PORT="%(ENV_MAIL_PORT)s",MAIL_SERVER="%(ENV_MAIL_SERVER)s",MAIL_FROM_NAME="%(ENV_MAIL_FROM_NAME)s",MAIL_STARTTLS="%(ENV_MAIL_STARTTLS)s",MAIL_SSL_TLS="%(ENV_MAIL_SSL_TLS)s",GOOGLE_CLIENT_ID="%(ENV_GOOGLE_CLIENT_ID)s",GOOGLE_CLIENT_SECRET="%(ENV_GOOGLE_CLIENT_SECRET)s",GOOGLE_REDIRECT_URI="%(ENV_GOOGLE_REDIRECT_URI)s",FRONTEND_URL="%(ENV_FRONTEND_URL)s"

[program:user-service]
command=uvicorn main:app --host 0.0.0.0 --port 8001
directory=/app/user-service
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:search-service]
command=uvicorn main:app --host 0.0.0.0 --port 8002
directory=/app/search-service
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=CHROMA_PERSIST_DIR="%(ENV_CHROMA_PERSIST_DIR)s"

[program:api-gateway]
command=uvicorn main_hf:app --host 0.0.0.0 --port 8080
directory=/app/api-gateway
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
